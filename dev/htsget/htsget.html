<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

<body>

<h1>htsget server example</h1>

<div id="myDiv" style="padding-top: 50px;padding-bottom: 20px; height: auto"></div>

<script type="module">

    import igv from "../../js/index.js"

    var div = document.getElementById("myDiv")
    var options = {
        genome: "hg38",
        locus: "chrM:4,851-8,872",
        tracks: [
            // {
            //     type: 'variant',
            //     name: 'VCF v4.3',
            //     sourceType: 'htsget',
            //     format: "VCF",
            //     url: 'https://htsget-rs.umccr.workers.dev/variants/vcf/spec-v4.3'
            // },
            //
            // // BCF is NOT supported in IGV.js
            // {
            //     type: 'variant',
            //     name: 'BCF v4.3',
            //     sourceType: 'htsget',
            //     format: "BCF",
            //     url: 'https://htsget-rs.umccr.workers.dev/variants/bcf/spec-v4.3'
            // },
            // {
            //    type: 'alignment',
            //    name: 'Mithocondrial DNA',
            //    sourceType: 'htsget',
            //    format: 'BAM',
            //    url: 'https://htsget-rs.umccr.workers.dev/reads/bam/mt.sorted'
            // },
            {
               type: 'alignment',
               name: 'Mithocondrial DNA',
               sourceType: 'htsget',
               format: 'BAM',
               url: 'http://localhost:8080/reads/data/bam/mt.sorted'
            },
            {
                name: "Allowed htsget regions",
                type: "interact",
                features: [
                    {
                        "chrM": "chrM",
                        "start1": 5904,
                        "end1": 7445,
                        "type": "Allowed"
                    },
                    {
                        "chrM": "chrM",
                        "start1": 0,
                        "end1": 5903,
                        "type": "Forbidden"
                    },
                    {
                        "chrM": "chrM",
                        "start1": 7446,
                        "end1": 16522,
                        "type": "Forbidden"
                    }
                ],
                colorBy: "type",
                colorTable: {
                    "Forbidden": "red",
                    "Allowed": "green",
                    "C": "#7fff00",
                },
            }
        ]
    }

    igv.createBrowser(div, options)

        .then(function (browser) {
            console.log("Created IGV browser")
        })


</script>

</body>

</html>
